(var(--i)*.3s + 1.5s)}@keyframes shn{0%{background-position:100% 0}45%,100%{background-position:0 0}}.btn:hover{transform:scale(1.03)}.btn,.ct,.lang button{position:relative;overflow:hidden;transition:background .3s,border-color .3s,transform .18s cubic-bezier(.2,.8,.2,1)}.btn:active,.ct:active,.lang button:active{transform:scale(.96)}.rail nav a:active{transform:scale(.8)}.rp{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(111,177,255,.45);transform:scale(0);animation:rpl .7s ease-out forwards;pointer-events:none}@keyframes rpl{to{transform:scale(14);opacity:0}}.row2{grid-template-columns:1fr}.st b em{width:8px;height:8px;background:var(--b3);display:block;box-shadow:0 0 10px var(--b2)}body.enter h1 i{animation:lw 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*.15s + 1.8s)}@keyframes lw{50%{transform:translateY(-6px)}}.sub .w{background:linear-gradient(100deg,#fff 35%,#8fc0ff 50%,#fff 65%) 100% 0/300% 100% no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 6s ease-in-out infinite;animation-delay:calc(var(--i)*.4s + 2s)}.kick::after{content:"_";margin-inline-start:6px;animation:bk 1s steps(2) infinite}@keyframes bk{50%{opacity:0}}.bio h3{position:relative;display:inline-block}.bio h3::after{content:"";position:absolute;inset-inline:0;bottom:-6px;height:2px;background:linear-gradient(90deg,var(--b3),transparent);transform:scaleX(0);transform-origin:left;transition:transform 1.2s .6s}[dir=rtl] .bio h3::after{transform-origin:right;background:linear-gradient(270deg,var(--b3),transparent)}.bio.in h3::after{transform:scaleX(1)}

/* ===== v2 tweaks ===== */
/* preloader: no explosion, calm code panel */

#pre.out{opacity:0;visibility:hidden;transform:none;filter:blur(10px);transition:opacity .8s ease,filter .8s ease,visibility 0s .8s}#fl{transition:opacity .22s ease-out,transform 1.2s ease-out}#pre.wash #fl{transform:scale(1.25)}
/* entrance: hero first, then the rest one after another */
body.enter .hero{animation:fadein 1s ease both}
.mq{opacity:0}body.enter .mq{animation:fadein 1s 1.4s both}
body.enter .mq{opacity:1}
#gl{transform:scale(.85);transition:opacity 1.8s .9s,transform 2.2s cubic-bezier(.2,.8,.2,1) .9s}
.rv{transform:translateY(32px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--n,0)*.14s)}
/* buttons press animation */
.btn,.ct,.lang button{-webkit-tap-highlight-color:transparent}
.btn:active,.ct:active,.lang button:active{filter:brightness(1.3)}

.rp{background:rgba(170,210,255,.55);animation-duration:.8s}
.btn::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::before{left:120%}
/* text overlap fixes */
[dir=rtl] .kick{letter-spacing:0}
[dir=rtl] h1{line-height:1.35}
.kick{margin-bottom:18px}.sub{line-height:1.45;margin:18px 0 14px}.lead{line-height:1.9}
.sub .w,.sh h2 .w{padding:.1em 0}
.sh h2{line-height:1.3}
.row2 h3,.st h3{line-height:1.4}.row2{gap:8px}
section p,section h3,.kick,.sub{text-shadow:0 1px 14px rgba(2,4,12,.95)}
.bio{background:rgba(2,4,12,.5)}
.rail a.lg{overflow:hidden;letter-spacing:.4em;font-size:clamp(11px,2vh,18px);padding:8px 0;min-height:0}
.ct b{overflow-wrap:anywhere}
@media(max-width:700px){.hero{padding-bottom:90px}}
@media(max-height:700px){.tick{display:none}}
@media(max-height:520px){.rail a.lg{display:none}}

#rain{opacity:0}body.enter #rain{opacity:.2}
.bio{background:rgba(2,4,12,.72);border-inline-start:3px solid var(--b2)}
.svc{background:rgba(2,4,12,.68);border:1px solid var(--ln)}

.hero .lead,.hero .sub,.hero .kick{position:relative;z-index:1}

.ct{flex-wrap:nowrap;gap:14px;padding:16px 18px;background-color:rgba(2,4,12,.72)}
.ct .nm{flex:1;min-width:0}
.ct b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(18px,5vw,30px)}
.ic2{width:clamp(44px,12vw,60px);height:clamp(44px,12vw,60px);flex:none}.ic2 svg{width:55%;height:55%}
.go{flex:none;white-space:nowrap;font-size:clamp(12px,3.4vw,16px);gap:6px}
.go .ar{font-size:20px}

/* ===== v4 ===== */
/* services layout: stacked, no overlap */
.row2{display:flex!important;flex-direction:column;gap:10px;padding:26px 20px;isolation:isolate}
.row2 h3{display:block;margin:0;line-height:1.4}
.row2 p{display:block;margin:0;line-height:1.85;font-size:clamp(15px,1.8vw,17px)}

.svc,.tl{overflow:hidden}
.st h3{line-height:1.4;margin-bottom:8px}.st p{line-height:1.8}
/* faster entrance */
