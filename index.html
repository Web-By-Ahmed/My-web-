<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed — Programmer & Web Creator</title>
<meta name="description" content="Ahmed — programmer and web creator. 3D websites, educational websites, restaurant sites with digital menus, and custom code.">
<meta name="theme-color" content="#05070f">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--fg:#eef3ff;--mut:#9fb0d0;--c1:#22d3ee;--c2:#8b5cf6;--c3:#ff4fb8;--c4:#ffb02e;--bd:rgba(150,175,255,.18);--glass:rgba(16,22,48,.55);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070f;--fg:#eef3ff}}
:root[data-theme="dark"]{--bg:#05070f}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Outfit,Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
[dir=rtl] body,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:Cairo,Outfit,system-ui,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aur{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aur i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:dr 22s ease-in-out infinite alternate}
.aur i:nth-child(1){background:var(--c2);left:-15vmax;top:-10vmax}.aur i:nth-child(2){background:var(--c1);right:-20vmax;top:30vh;animation-delay:-7s}.aur i:nth-child(3){background:var(--c3);left:20vw;bottom:-30vmax;animation-delay:-13s;opacity:.18}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.2)}}
#pg{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));z-index:70}
[dir=rtl] #pg{transform-origin:right}
#cur{position:fixed;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.16),transparent 65%);z-index:1;pointer-events:none;left:0;top:0}
nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 24px));z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 20px;border-radius:999px;background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);direction:ltr}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.32em;font-size:15px;color:var(--fg);text-decoration:none}
.logo svg{width:26px;height:26px;stroke:var(--c1);fill:none;stroke-width:1.8}
.links{display:flex;gap:26px;direction:var(--d,ltr)}
.links a{color:var(--mut);text-decoration:none;font-size:14px;position:relative;padding:4px 0}
.links a:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--c1);transform:scaleX(0);transition:.3s}
.links a:hover,.links a.on{color:var(--fg)}.links a:hover:after,.links a.on:after{transform:scaleX(1)}
.lang{display:flex;border:1px solid var(--bd);border-radius:999px;padding:3px;background:rgba(255,255,255,.04)}
.lang button{font:inherit;font-size:13px;border:0;background:none;color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button.on{background:linear-gradient(90deg,var(--c1),#3b9bff);color:#031b24;font-weight:800}
section{position:relative;z-index:2;padding:110px max(20px,5vw) 70px;max-width:1240px;margin:0 auto;direction:var(--d,ltr)}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:130px}
.kick{display:inline-flex;align-items:center;gap:10px;color:var(--c1);font-size:14px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:18px}
.kick:before{content:"";width:38px;height:2px;background:var(--c1);box-shadow:0 0 12px var(--c1)}
h1{margin:0;font-size:clamp(54px,10vw,132px);line-height:.95;font-weight:800;letter-spacing:-.03em;perspective:600px}
h1 i{display:inline-block;font-style:normal;animation:ch .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.06s + var(--o,5.2s))}
@keyframes ch{from{opacity:0;transform:translateY(60px) rotateX(-90deg)}}
.grad{background:linear-gradient(100deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 7s linear infinite}
@keyframes gs{to{background-position:300% 0}}
.sub{font-size:clamp(24px,4.4vw,56px);font-weight:800;margin:10px 0 22px;line-height:1.1}
.lead{max-width:520px;color:var(--mut);font-size:clamp(16px,1.8vw,20px);line-height:1.7;margin:0 0 34px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;color:var(--fg);border:1px solid var(--bd);background:rgba(255,255,255,.05);transition:transform .3s,box-shadow .3s}
.btn.p{background:linear-gradient(90deg,var(--c1),#3b9bff);color:#031b24;border:0;box-shadow:0 0 30px rgba(34,211,238,.45)}
.btn:hover{transform:translateY(-4px) scale(1.03)}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sh 3.5s infinite}
@keyframes sh{60%,100%{left:140%}}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
[dir=rtl] .btn svg{transform:scaleX(-1)}
.scroll{position:absolute;bottom:26px;left:max(20px,5vw);width:26px;height:44px;border:2px solid var(--bd);border-radius:20px}
.scroll:after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--c1);animation:sc 1.8s infinite}
@keyframes sc{to{transform:translateY(18px);opacity:0}}
.mq{position:relative;z-index:2;overflow:hidden;border-block:1px solid var(--bd);background:rgba(8,12,30,.55);padding:18px 0;transform:rotate(-1.5deg);margin:20px -2vw;direction:ltr}
.mq div{display:flex;gap:40px;width:max-content;animation:mq 30s linear infinite;font-size:clamp(20px,3vw,34px);font-weight:800;white-space:nowrap}
.mq div span{display:flex;align-items:center;gap:40px;color:transparent;-webkit-text-stroke:1px rgba(220,230,255,.55)}
.mq div span:nth-child(odd){color:var(--fg);-webkit-text-stroke:0}
.mq svg{width:26px;height:26px;fill:var(--c1);flex:none}
@keyframes mq{to{transform:translateX(-50%)}}
.num{font-size:14px;color:var(--c1);letter-spacing:.3em;margin-bottom:10px}
h2{margin:0 0 40px;font-size:clamp(36px,6vw,72px);font-weight:800;letter-spacing:-.02em;line-height:1}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--n,0)*.12s)}
.rv.in{opacity:1;transform:none}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bio{padding:34px;font-size:clamp(17px,1.9vw,21px);line-height:1.85;color:#dbe5ff;position:relative}
.bio h3{margin:0 0 14px;font-size:24px}
.bio:before{content:"";position:absolute;inset:-1px;border-radius:26px;padding:1px;background:linear-gradient(135deg,var(--c1),transparent 40%,var(--c3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.stack{position:relative;height:340px;perspective:900px}
.stack div{position:absolute;inset:0;margin:auto;width:230px;height:230px;border-radius:30px;border:1px solid var(--bd);animation:sk 9s ease-in-out infinite;animation-delay:calc(var(--k)*-1.4s)}
.stack div:nth-child(1){background:linear-gradient(135deg,rgba(34,211,238,.35),rgba(34,211,238,.04))}.stack div:nth-child(2){background:linear-gradient(135deg,rgba(139,92,246,.4),rgba(139,92,246,.05))}.stack div:nth-child(3){background:linear-gradient(135deg,rgba(255,79,184,.4),rgba(255,79,184,.05))}.stack div:nth-child(4){background:linear-gradient(135deg,rgba(255,176,46,.4),rgba(255,176,46,.05))}
@keyframes sk{0%,100%{transform:rotateX(60deg) rotateZ(-30deg) translateZ(calc(var(--k)*34px - 50px))}50%{transform:rotateX(60deg) rotateZ(30deg) translateZ(calc(var(--k)*50px - 70px))}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;perspective:1100px}
.card{--rx:0deg;--ry:0deg;position:relative;padding:30px 26px 32px;border-radius:26px;background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .15s,border-color .3s;overflow:hidden}
.card:hover{border-color:var(--cc)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),color-mix(in srgb,var(--cc) 35%,transparent),transparent 55%);opacity:0;transition:.3s}
.card:hover:before{opacity:1}
.ic{width:84px;height:84px;margin-bottom:22px;transform:translateZ(50px);filter:drop-shadow(0 10px 18px color-mix(in srgb,var(--cc) 55%,transparent));animation:fl 5s ease-in-out infinite}
.ic svg{width:100%;height:100%;fill:none;stroke:var(--cc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic svg *{stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset 1.6s ease .3s}
.in .ic svg *{stroke-dashoffset:0}
.card h3{margin:0 0 10px;font-size:22px;transform:translateZ(30px)}
.card p{margin:0;color:var(--mut);line-height:1.7;transform:translateZ(20px)}
.card .big{position:absolute;right:16px;top:6px;font-size:90px;font-weight:800;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--cc) 45%,transparent);line-height:1}
[dir=rtl] .card .big{right:auto;left:16px}
@keyframes fl{50%{transform:translateZ(50px) translateY(-8px)}}
.steps{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
.steps:before{content:"";position:absolute;top:44px;left:0;right:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));transform-origin:left;transform:scaleX(var(--p,0));opacity:.8;box-shadow:0 0 18px var(--c2)}
[dir=rtl] .steps:before{transform-origin:right}
.step{position:relative;padding-top:0}
.dot{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;background:var(--bg);border:2px solid var(--cc);color:var(--cc);box-shadow:0 0 0 8px color-mix(in srgb,var(--cc) 14%,transparent),0 0 30px color-mix(in srgb,var(--cc) 50%,transparent);margin-bottom:22px;animation:pu 3s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--cc) 6%,transparent),0 0 44px color-mix(in srgb,var(--cc) 70%,transparent)}}
.step h3{margin:0 0 6px;font-size:22px}.step p{margin:0;color:var(--mut)}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.ct{display:flex;align-items:center;gap:18px;padding:22px;border-radius:24px;text-decoration:none;color:var(--fg);background:var(--glass);border:1px solid var(--bd);position:relative;overflow:hidden;transition:transform .35s,border-color .3s,box-shadow .35s}
.ct:hover{transform:translateY(-8px);border-color:var(--cc);box-shadow:0 20px 50px color-mix(in srgb,var(--cc) 30%,transparent)}
.ct .t{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none;transition:transform .5s}
.ct:hover .t{transform:rotate(-12deg) scale(1.12)}
.ct .t svg{width:30px;height:30px}
.ct b{display:block;font-size:20px}.ct small{display:block;color:var(--mut);margin:3px 0 6px;direction:ltr;text-align:start}
.go{font-weight:800;color:var(--cc);text-shadow:0 0 10px var(--cc),0 0 24px var(--cc);animation:gl 2s ease-in-out infinite}
@keyframes gl{50%{text-shadow:0 0 16px var(--cc),0 0 38px var(--cc)}}
footer{position:relative;z-index:2;text-align:center;padding:40px 20px calc(50px + env(safe-area-inset-bottom,0px));color:var(--mut);border-top:1px solid var(--bd);margin-top:60px;background:rgba(4,6,14,.6)}
.st{position:absolute;z-index:1;pointer-events:none;fill:none;stroke-width:2;animation:fl2 9s ease-in-out infinite;opacity:.8}
@keyframes fl2{50%{transform:translateY(-26px) rotate(40deg)}}
.card.rv{transition:opacity .9s,transform .15s,border-color .3s;transition-delay:calc(var(--n,0)*.12s),0s,0s}.card.rv.in{transform:rotateX(var(--rx)) rotateY(var(--ry))}
.ct.rv{transition:opacity .9s,transform .35s,border-color .3s,box-shadow .35s;transition-delay:calc(var(--n,0)*.12s),0s,0s,0s}
.grain{position:fixed;inset:-50%;z-index:80;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:gr .8s steps(4) infinite}
@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#pre{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .8s,visibility .8s}
#pre.out{opacity:0;visibility:hidden}
#pre svg{display:block;margin:auto;width:90px;height:90px;fill:none;stroke:var(--c1);stroke-width:1.6;stroke-dasharray:200;stroke-dashoffset:200;animation:dw 1.6s ease forwards;filter:drop-shadow(0 0 14px var(--c1))}
@keyframes dw{to{stroke-dashoffset:0}}
#pre b{display:block;text-align:center;margin-top:20px;letter-spacing:.5em;font-size:13px;color:var(--mut)}
#pre i{display:block;width:180px;height:2px;margin:14px auto 0;background:rgba(255,255,255,.1);overflow:hidden}
#pre i:after{content:"";display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c3));animation:ld 1.5s ease forwards;transform:translateX(-100%)}
@keyframes ld{to{transform:none}}
#dot,#rg{position:fixed;left:0;top:0;z-index:90;pointer-events:none;border-radius:50%}
#dot{width:8px;height:8px;margin:-4px;background:var(--c1);box-shadow:0 0 12px var(--c1)}
#rg{width:40px;height:40px;margin:-20px;border:1.5px solid rgba(34,211,238,.6);transition:width .3s,height .3s,margin .3s,background .3s}
body:has(a:hover,button:hover) #rg{width:64px;height:64px;margin:-32px;background:rgba(34,211,238,.08)}
.floor{position:absolute;left:-10vw;right:-10vw;bottom:0;height:46vh;z-index:0;pointer-events:none;perspective:500px;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
.floor:before{content:"";position:absolute;inset:0;transform:rotateX(62deg);transform-origin:bottom;background-image:linear-gradient(rgba(34,211,238,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.3) 1px,transparent 1px);background-size:60px 60px;animation:fm 3s linear infinite}
@keyframes fm{to{background-position:0 60px}}
.win{position:absolute;right:max(16px,3vw);bottom:11%;width:min(340px,42vw);z-index:3;border-radius:16px;overflow:hidden;background:rgba(10,14,34,.82);border:1px solid var(--bd);box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 40px rgba(34,211,238,.15);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:wf 7s ease-in-out infinite;direction:ltr;transform:perspective(900px) rotateY(-14deg) rotateX(6deg)}
@keyframes wf{50%{transform:perspective(900px) rotateY(-8deg) rotateX(3deg) translateY(-14px)}}
.win .tb{display:flex;gap:7px;padding:11px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--bd)}
.win .tb i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.win .tb i:nth-child(2){background:#febc2e}.win .tb i:nth-child(3){background:#28c840}
.win pre{margin:0;padding:16px 18px;font:13px/1.8 ui-monospace,Menlo,Consolas,monospace;color:#cdd9ff;min-height:150px;white-space:pre-wrap}
.win pre b{color:var(--c3);font-weight:400}.win pre u{color:var(--c1);text-decoration:none}.win pre s{color:var(--c4);text-decoration:none}
.win pre:after{content:"";display:inline-block;width:7px;height:15px;background:var(--c1);vertical-align:middle;animation:bk 1s steps(2) infinite}
@keyframes bk{50%{opacity:0}}
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.05);font-size:13px;color:var(--mut);margin-bottom:18px;width:max-content}
.badge i{width:9px;height:9px;border-radius:50%;background:#3dff8b;animation:bp 1.8s infinite}
@keyframes bp{0%{box-shadow:0 0 0 0 rgba(61,255,139,.7)}100%{box-shadow:0 0 0 12px rgba(61,255,139,0)}}
.chip3{position:absolute;z-index:3;padding:9px 16px;border-radius:12px;font-weight:800;font-size:14px;background:rgba(10,14,34,.78);border:1px solid var(--cc);color:var(--cc);box-shadow:0 0 24px color-mix(in srgb,var(--cc) 40%,transparent);animation:fl3 8s ease-in-out infinite}
@keyframes fl3{50%{transform:translateY(-16px)}}
.mq.r{transform:rotate(1.2deg);margin-top:-6px}.mq.r div{animation-direction:reverse}
.fm{margin-top:26px;padding:26px;display:grid;gap:14px;max-width:620px}
.fm input,.fm textarea{font:inherit;color:var(--fg);background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;outline:none;resize:vertical;direction:var(--d,ltr)}
.fm input:focus,.fm textarea:focus{border-color:var(--c1);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
.fl{display:flex;gap:12px;justify-content:center;margin-bottom:20px}.fl a{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;transition:transform .3s}.fl a:hover{transform:translateY(-6px) rotate(-8deg)}.fl svg{width:22px;height:22px}
#up{position:fixed;inset-inline-end:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:48px;height:48px;z-index:55;display:grid;place-items:center;border-radius:50%;background:var(--glass);border:1px solid var(--bd);opacity:0;pointer-events:none;transition:.4s}
#up.sh{opacity:1;pointer-events:auto}#up svg{position:absolute;left:0;top:0;width:48px;height:48px;fill:none;stroke:var(--c1);stroke-width:2;transform:rotate(-90deg)}
#up circle{stroke-dasharray:119.4;stroke-dashoffset:119.4}#up .ar{width:18px;height:18px;left:15px;top:15px;transform:none;stroke:var(--fg)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
@media(max-width:820px){.win,.chip3{display:none}#up{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}}
@media(hover:none){#dot,#rg{display:none}}
#pre{display:block;overflow:hidden}
#pre canvas{position:absolute;inset:0;width:100%;height:100%}
#pre.glitch canvas{animation:gt .25s steps(2) 3}
@keyframes gt{25%{transform:translate(-8px,3px) skewX(4deg);filter:hue-rotate(90deg)}75%{transform:translate(8px,-3px) skewX(-4deg);filter:hue-rotate(-90deg)}}
.term{position:absolute;left:max(18px,4vw);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);font:12px/1.8 ui-monospace,Menlo,Consolas,monospace;color:#7dffd8;direction:ltr;text-shadow:0 0 8px rgba(34,211,238,.6);text-align:left;min-height:130px;background:rgba(5,7,15,.6);padding:8px 12px;border-radius:10px}
.term div{opacity:0;animation:tl .3s forwards}@keyframes tl{to{opacity:1}}
.term em{color:#3dff8b;font-style:normal}
#pct{position:absolute;right:max(18px,4vw);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);font:800 clamp(40px,8vw,90px)/1 Outfit,sans-serif;color:transparent;-webkit-text-stroke:1px var(--c1);direction:ltr}
